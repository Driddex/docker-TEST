name: checker

on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checker
        uses: actions/checkout@v4
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        
      - name: scan-for-error
        run: python -m compileall

