name: git-auto

on:
  push:
    branches: [ 'main' ]

jobs:
  check-project:
    runs-on: ubuntu-latest
    
    steps:
      - name: Dowload code
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan Code For Errors
        run: python -m compileall .