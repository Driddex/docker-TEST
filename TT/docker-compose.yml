services:
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80" 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2

  backend1:
    build: ./api
    container_name: backend1
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:0208_password@db:5432/demo
    depends_on:
      - db

  backend2:
    build: ./api
    container_name: backend2
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:0208_password@db:5432/demo
    depends_on:
      - db

  frontend:
    build: ./frontend 
    container_name: frontend_client
    restart: always
    ports:
      - "3000:3000"

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "0208_password"
      POSTGRES_DB: "demo"
    ports:
      - "8120:5432" 
    volumes:
      - pg_news_data:/var/lib/postgresql/data 

volumes:
  pg_news_data: