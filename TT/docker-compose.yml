services:
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2

  backend1:
    build: ./api
    container_name: backend1
    restart: always

  backend2:
    build: ./api
    container_name: backend2
    restart: always

  frontend:
    image: node:20-alpine
    build: ./frontend
    container_name: frontend_client
    restart: always
    ports:
      - "3000:3000"